services:
  - type: web
    name: task-board
    runtime: node
    plan: free
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_USER_EMAIL
        value: demo@taskboard.dev
      - key: SEED_USER_PASSWORD
        value: password123